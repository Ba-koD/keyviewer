name: Test and build

on:
  push:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
      - "ui/**"
      - ".cargo/config.toml"
      - ".github/workflows/test.yml"
      - "check-all.sh"
      - "check-all.ps1"
  pull_request:
    branches: [main, master]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
      - "ui/**"
      - ".cargo/config.toml"
      - ".github/workflows/test.yml"
  workflow_dispatch:

concurrency:
  group: test-and-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from Cargo.toml
        id: version
        run: |
          version=$(grep -m1 '^version\s*=' src-tauri/Cargo.toml | sed -E 's/version\s*=\s*"([^"]+)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  fmt-clippy-test-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> dist'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxtst-dev \
            libxdo-dev \
            libxcb1-dev
      - name: fmt
        run: cargo kfmt
      - name: clippy
        run: cargo kclippy
      - name: test
        run: cargo ktest

  build-windows-portable:
    needs: prepare
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> dist'
      - name: Build release binary
        run: cargo kb --release
      - name: Package portable files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/release" | Out-Null
          Copy-Item "dist/release/KBQV.exe" "dist/release/KBQV-windows-x64.exe" -Force
          Compress-Archive -Path "dist/release/KBQV.exe" -DestinationPath "dist/release/KBQV-windows-x64.zip" -Force
      - name: Upload windows portable artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-${{ needs.prepare.outputs.version }}
          path: |
            dist/release/KBQV-windows-x64.exe
            dist/release/KBQV-windows-x64.zip

  build-linux-portable:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> dist'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxtst-dev \
            libxdo-dev \
            libxcb1-dev
      - name: Build release binary
        run: cargo kb --release
      - name: Package portable files
        run: |
          mkdir -p dist/release
          cp "dist/release/KBQV" "dist/release/KBQV-linux-x64"
          tar -czf "dist/release/KBQV-linux-x64.tar.gz" -C dist/release "KBQV-linux-x64"
      - name: Upload linux portable artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-portable-${{ needs.prepare.outputs.version }}
          path: |
            dist/release/KBQV-linux-x64
            dist/release/KBQV-linux-x64.tar.gz

  build-macos-portable:
    needs: prepare
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> dist'
      - name: Build release binary
        run: cargo kb --release
      - name: Package portable files
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then ARCH_TAG="x64"; else ARCH_TAG="arm64"; fi
          mkdir -p dist/release
          cp "dist/release/KBQV" "dist/release/KBQV-macos-$ARCH_TAG"
          ditto -c -k "dist/release/KBQV-macos-$ARCH_TAG" "dist/release/KBQV-macos-$ARCH_TAG.zip"
      - name: Upload macOS portable artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-portable-${{ needs.prepare.outputs.version }}
          path: |
            dist/release/KBQV-macos-*
